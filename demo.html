<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C1422"><meta name="robots" content="noindex"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>AIRA · Demo institucional</title>
<style>
:root{color-scheme:dark;--bg:#0c1422;--card:#192537;--line:#35465a;--ink:#f1f5fb;--muted:#b7c5d8;--lime:#bce95a;--blue:#78aedf;--warn:#ffd19a;--bad:#ffb4b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#203b56,transparent 45%),var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{color:var(--blue)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.wrap{max-width:1080px;margin:auto;padding:20px 18px 110px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:13px}.small{font-size:12px;color:var(--muted)}.kicker{font-size:11px;font-weight:750;letter-spacing:1.4px;color:var(--lime);text-transform:uppercase}.notice{padding:11px 14px;border:1px solid var(--line);border-radius:16px;background:#23364a;color:var(--muted);font-size:13px;margin-bottom:20px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.5px;line-height:1.1;margin:8px 0 12px}h2{font-size:20px;margin:0 0 12px;letter-spacing:-.3px}h3{margin:0 0 5px;font-size:16px}p{margin:7px 0 12px}.card{background:linear-gradient(145deg,#23354be8,#192537e8);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.metric strong{display:block;font-size:clamp(25px,4vw,36px);font-variant-numeric:tabular-nums;letter-spacing:-1px}.metric button{width:100%;text-align:left;background:none;border:0;padding:0}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}.amount{font-size:clamp(26px,5vw,45px);font-weight:750;letter-spacing:-1.4px;overflow-wrap:anywhere}.bar{height:8px;background:#35465a;border-radius:20px;overflow:hidden;margin:12px 0}.bar span{display:block;background:var(--lime);height:100%}.dock{position:fixed;z-index:2;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#0c1422e8;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.dock div{display:flex;gap:4px;width:min(100%,660px)}.dock button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);border-radius:14px;padding:10px 3px;min-height:50px;font-size:12px}.dock button[aria-current=page]{color:var(--lime);background:#26394d;font-weight:700}.pill{display:inline-block;border-radius:20px;background:#2f4053;padding:4px 9px;font-size:12px}.done{color:var(--lime)}.review{color:var(--blue)}.obs{color:var(--warn)}.cancel{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select{background:#142234;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:44px;max-width:100%}.toolbar input{flex:1;min-width:150px}.record{display:flex;gap:12px;justify-content:space-between;align-items:center;background:#142234;border:1px solid var(--line);border-radius:14px;width:100%;padding:12px;margin:7px 0;text-align:left}.record[aria-pressed=true]{border-color:var(--lime)}.record b,.record small{display:block}.record small{color:var(--muted)}.record .pill{white-space:normal;flex-shrink:0;max-width:44%;text-align:center}.line{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}.primary{border:0;border-radius:13px;background:var(--lime);color:#101a23;font-weight:750;min-height:44px;padding:10px 15px}.secondary{border:1px solid var(--line);border-radius:13px;background:#26394d;min-height:44px;padding:10px 15px}.section{margin-top:18px}.hidden,[hidden]{display:none!important}@media(max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.wrap{padding:14px 13px 105px}.card{padding:15px}.head{align-items:start}.head>a{font-size:12px}.metric strong{font-size:27px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main class="wrap"><header class="head"><div class="brand"><img src="/apple-touch-icon.png" alt="Isotipo ALCAINTEGRA"><div><strong>ALCAINTEGRA / AIRA</strong><div class="small">Midnight G² · Demo 2027</div></div></div><a href="/">Sitio oficial</a></header><div class="notice"><strong>Entorno de demostración.</strong> Ayuntamiento Ejemplo (ficticio), enero 2027. No se conecta a SIGMAVER, Supabase ni a expedientes reales. No introduzcas información personal.</div><div id="view" aria-live="polite"></div></main><nav class="dock" aria-label="Módulos"><div><button data-view="home" aria-current="page">Resumen</button><button data-view="cases">Expedientes</button><button data-view="payments">Pagos</button><button data-view="funds">Fondos</button><button data-view="control">AIRA</button></div></nav>
<script>
"use strict";
const labels={done:"Integrado",review:"En revisión",obs:"Observaciones",cancel:"Cancelado"};
const docs=["Póliza de pago","Orden de pago","CFDI","Verificación CFDI","Evidencia del servicio"];
const rows=[
{n:1,concept:"Material de oficina",fund:"Participaciones",cents:1856000,state:"done",checks:[1,1,1,1,1]},
{n:2,concept:"Mantenimiento preventivo",fund:"Participaciones",cents:3248000,state:"review",checks:[1,1,1,0,0]},
{n:3,concept:"Equipo de protección",fund:"FORTAMUNDF",cents:7650000,state:"obs",checks:[1,0,1,0,0]},
{n:4,concept:"Servicio de limpieza",fund:"Ingresos propios",cents:1245000,state:"done",checks:[1,1,1,1,1]},
{n:5,concept:"Operación cancelada",fund:"Participaciones",cents:950000,state:"cancel",checks:[]},
{n:6,concept:"Material de mantenimiento",fund:"FAISMUN",cents:4150000,state:"review",checks:[1,1,0,0,1]},
{n:7,concept:"Suministro de papelería",fund:"Ingresos propios",cents:840000,state:"done",checks:[1,1,1,1,1]},
{n:8,concept:"Servicio de comunicación",fund:"Participaciones",cents:1585000,state:"obs",checks:[1,1,1,0,0]}
].map(r=>({...r,id:"P202701"+String(r.n).padStart(6,"0")}));
const money=c=>new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN"}).format(c/100);
const active=rows.filter(r=>r.state!=="cancel"),total=rs=>rs.reduce((s,r)=>s+r.cents,0),checks=active.flatMap(r=>r.checks),ok=checks.filter(Boolean).length,pct=Math.round(ok/checks.length*100),count=s=>rows.filter(r=>r.state===s).length;
let mode="home",filter="all",query="",selected=rows[0].id;
const v=document.querySelector("#view");
const pill=r=>'<span class="pill '+r.state+'">'+labels[r.state]+'</span>';
function nav(next,keep=false){mode=next;if(!keep){query="";filter="all"}document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===mode?"page":"false"));render();window.scrollTo(0,0)}
function render(){if(mode==="home"){v.innerHTML='<div class="kicker">Ejercicio fiscal 2027 · Enero</div><h1>Centro de control</h1><p class="small">Indicadores calculados a partir de los registros de esta muestra.</p><div class="grid">'+[["Todos",rows.length,"all"],["En revisión",count("review"),"review"],["Observaciones",count("obs"),"obs"],["Integrados",count("done"),"done"]].map(x=>'<article class="card metric"><button data-filterjump="'+x[2]+'"><span class="small">'+x[0]+'</span><strong>'+x[1]+'</strong></button></article>').join("")+'</div><div class="two"><article class="card"><div class="kicker">Pólizas no canceladas</div><div class="amount">'+money(total(active))+'</div><p class="small">'+active.length+' operaciones vigentes · '+count("cancel")+' cancelada</p><button class="primary" data-go="payments">Consultar pagos</button></article><article class="card"><h2>Avance documental</h2><div class="amount">'+pct+'%</div><div class="bar"><span style="width:'+pct+'%"></span></div><p>'+ok+' de '+checks.length+' requisitos ilustrativos integrados</p><button class="secondary" data-go="control">Ver alertas</button></article></div><div class="card section"><h2>Seguimiento reciente</h2>'+rows.slice(-3).reverse().map(r=>'<div class="line"><div><strong>'+r.id+'</strong><div class="small">'+r.concept+'</div></div>'+pill(r)+'</div>').join("")+'</div>';return}
if(mode==="cases"||mode==="payments"){v.innerHTML='<div class="kicker">Enero · 2027</div><h1>'+ (mode==="cases"?"Expedientes":"Pólizas de pago")+'</h1><div class="toolbar"><input id="q" type="search" placeholder="Buscar folio o concepto" aria-label="Buscar folio o concepto"><select id="f" aria-label="Filtrar por estado"><option value="all">Todos los estados</option>'+Object.entries(labels).map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join("")+'</select></div><div class="two"><article class="card"><h2 id="resultcount">Registros</h2><div id="records"></div></article><article class="card" id="detail"></article></div>';const q=document.querySelector("#q"),f=document.querySelector("#f");q.value=query;f.value=filter;q.oninput=()=>{query=q.value;renderList()};f.onchange=()=>{filter=f.value;renderList()};renderList();return}
if(mode==="funds"){const funds=[...new Set(rows.map(r=>r.fund))];v.innerHTML='<div class="kicker">Control del gasto</div><h1>Fondos y recursos</h1><p class="small">Importes de pólizas no canceladas; no representan presupuesto autorizado ni saldo disponible.</p><div class="two">'+funds.map(f=>{const a=active.filter(r=>r.fund===f);return '<article class="card"><h2>'+f+'</h2><div class="amount">'+money(total(a))+'</div><div class="bar"><span style="width:'+Math.round(total(a)/total(active)*100)+'%"></span></div><p class="small">'+a.length+' pólizas vigentes</p></article>'}).join("")+'</div>';return}
v.innerHTML='<div class="kicker">Fiscalización preventiva · Simulación</div><h1>Centro AIRA</h1><div class="grid"><article class="card metric"><span class="small">Requisitos pendientes</span><strong>'+ (checks.length-ok)+'</strong></article><article class="card metric"><span class="small">Con observaciones</span><strong>'+count("obs")+'</strong></article><article class="card metric"><span class="small">Integrados</span><strong>'+count("done")+'</strong></article><article class="card metric"><span class="small">Cancelados</span><strong>'+count("cancel")+'</strong></article></div><article class="card"><h2>Alertas documentales de ejemplo</h2>'+active.filter(r=>r.checks.some(x=>!x)).map(r=>'<div class="line"><div><strong>'+r.id+'</strong><div class="small">'+docs.filter((_,i)=>!r.checks[i]).join(" · ")+'</div></div><button class="secondary" data-open="'+r.id+'">Revisar</button></div>').join("")+'<p class="small">Las alertas derivan de la lista ficticia, no de una determinación de incumplimiento legal. Una póliza integrada aún requiere autorizaciones aplicables.</p></article>'}
function renderList(){const found=rows.filter(r=>(filter==="all"||filter===r.state)&&(r.id+" "+r.concept+" "+r.fund).toLowerCase().includes(query.toLowerCase().trim()));if(!found.some(r=>r.id===selected))selected=found[0]?.id||"";document.querySelector("#resultcount").textContent=found.length+" registros";document.querySelector("#records").innerHTML=found.map(r=>'<button class="record" data-record="'+r.id+'" aria-pressed="'+(selected===r.id)+'"><span><b>'+r.id+'</b><small>'+r.concept+'</small><small>'+money(r.cents)+'</small></span>'+pill(r)+'</button>').join("")||'<p>Sin coincidencias.</p>';const r=found.find(r=>r.id===selected);document.querySelector("#detail").innerHTML=r?'<div class="kicker">Detalle de muestra</div><h2>'+r.id+'</h2><p>'+r.concept+' · '+r.fund+'</p><div class="amount">'+money(r.cents)+'</div>'+pill(r)+(r.state==="cancel"?'<p>Se conserva el registro histórico. Excluido del importe vigente.</p>':docs.map((d,i)=>'<div class="line"><span>'+d+'</span><b class="'+(r.checks[i]?"done":"obs")+'">'+(r.checks[i]?"En muestra":"Pendiente")+'</b></div>').join("")):'<p>Selecciona una póliza.</p>'}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.view)nav(b.dataset.view);else if(b.dataset.go)nav(b.dataset.go);else if(b.dataset.filterjump){filter=b.dataset.filterjump;query="";nav("cases",true)}else if(b.dataset.open){selected=b.dataset.open;nav("cases")}else if(b.dataset.record){selected=b.dataset.record;renderList();document.querySelector('[data-record="'+selected+'"]')?.focus()}});render();
</script></body></html>
